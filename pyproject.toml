[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cvewatchdog"
version = "1.4.1"
description = "Cross-platform installed-software vulnerability scanner for FastCVE-API"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
dependencies = ["requests==2.32.5"]

[project.scripts]
cvewatchdog = "CVEWatchdog:main"

[tool.setuptools]
py-modules = ["CVEWatchdog", "cwe_names"]
