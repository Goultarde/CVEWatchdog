[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cvewatchdog"
version = "2.0.1"
description = "Cross-platform installed-software vulnerability scanner for FastCVE-API"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
dependencies = [
    "requests==2.32.5",
    "fastapi==0.120.4",
    "uvicorn==0.38.0",
]

[project.scripts]
cvewatchdog = "CVEWatchdog:main"
cvewatchdog-server = "cvewatchdog_server:main"

[tool.setuptools]
py-modules = ["CVEWatchdog", "cwe_names", "cvewatchdog_server"]
