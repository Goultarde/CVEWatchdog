[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cvewatchdog"
version = "2.1.0"
description = "Cross-platform vulnerability scanner with an embedded FastCVE engine"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
    "requests==2.32.5",
    "fastapi==0.120.4",
    "uvicorn==0.38.0",
    "fastcve-api @ git+https://github.com/Goultarde/FastCVE-API.git@main",
]

[project.scripts]
cvewatchdog = "CVEWatchdog:main"
cvewatchdog-server = "cvewatchdog_server:main"

[tool.setuptools]
py-modules = ["CVEWatchdog", "cwe_names", "cvewatchdog_server"]
